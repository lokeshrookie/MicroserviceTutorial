# JWT secret is defined once here and injected into every service as an
# environment variable. ASP.NET Core environment variables override appsettings.json
# values, so changing the secret only requires updating this file.
x-jwt-env: &jwt-env
  Jwt__Key: "this_is_my_super_secret_key_for_auth_service"
  Jwt__Issuer: "AuthService"

services:
  gateway:
    build:
      context: .
      dockerfile: Gateway/Dockerfile
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - Jwt__Key=this_is_my_super_secret_key_for_auth_service
      - Jwt__Issuer=AuthService
    depends_on:
      productservice:
        condition: service_healthy
      orderservice:
        condition: service_healthy
      authservice:
        condition: service_healthy
    networks:
      - microservices-net

  productservice:
    build:
      context: .
      dockerfile: ProductService/Dockerfile
    ports:
      - "5001:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - Jwt__Key=this_is_my_super_secret_key_for_auth_service
      - Jwt__Issuer=AuthService
      - ConnectionStrings__DefaultConnection=Host=postgres-product;Port=5432;Database=productdb;Username=productuser;Password=productpassword
    depends_on:
      postgres-product:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80/health" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s

  orderservice:
    build:
      context: .
      dockerfile: OrderService/Dockerfile
    ports:
      - "5002:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - Jwt__Key=this_is_my_super_secret_key_for_auth_service
      - Jwt__Issuer=AuthService
      - Services__ProductService=http://productservice
      - ConnectionStrings__DefaultConnection=Host=postgres-order;Port=5432;Database=orderdb;Username=orderuser;Password=orderpassword
    depends_on:
      postgres-order:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80/health" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s

  authservice:
    build:
      context: .
      dockerfile: AuthService/Dockerfile
    ports:
      - "5003:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - Jwt__Key=this_is_my_super_secret_key_for_auth_service
      - Jwt__Issuer=AuthService
      - ConnectionStrings__DefaultConnection=Host=postgres-auth;Port=5432;Database=authdb;Username=authuser;Password=authpassword
    depends_on:
      postgres-auth:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80/health" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s

  postgres-auth:
    image: postgres:16
    container_name: microservicetutorial-postgres-auth
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: authpassword
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authuser -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - microservices-net

  postgres-order:
    image: postgres:16
    container_name: microservicetutorial-postgres-order
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: orderuser
      POSTGRES_PASSWORD: orderpassword
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderuser -d orderdb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - microservices-net

  postgres-product:
    image: postgres:16
    container_name: microservicetutorial-postgres-product
    environment:
      POSTGRES_DB: productdb
      POSTGRES_USER: productuser
      POSTGRES_PASSWORD: productpassword
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U productuser -d productdb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge
